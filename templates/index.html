<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, responsive rule-based chatbot web application powered by Python Flask backend and modern JavaScript frontend.">
    <title>PyBot — Rule-Based Chatbot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-decorations" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="chat-app-wrapper">
        <!-- Main Chat Container -->
        <main class="chat-card" id="chat-card">
            
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="bot-profile">
                    <div class="avatar-badge">
                        <div class="avatar-icon">
                            <!-- Robot SVG -->
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                                <circle cx="12" cy="5" r="2"></circle>
                                <path d="M12 7v4"></path>
                                <line x1="8" y1="16" x2="8" y2="16"></line>
                                <line x1="16" y1="16" x2="16" y2="16"></line>
                            </svg>
                        </div>
                        <span class="status-indicator" title="Online"></span>
                    </div>
                    <div class="header-info">
                        <h1 class="bot-title">PyBot</h1>
                        <span class="bot-status-text">Rule-Based Assistant • Online</span>
                    </div>
                </div>

                <div class="header-actions">
                    <button type="button" id="clear-btn" class="header-action-btn" title="Reset conversation" aria-label="Clear chat">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>
            </header>

            <!-- Quick Suggestions Banner -->
            <div class="quick-suggestions-bar">
                <span class="suggestions-label">Try asking:</span>
                <div class="suggestions-list" id="quick-suggestions">
                    <button type="button" class="suggestion-chip" data-msg="hello">👋 Hello</button>
                    <button type="button" class="suggestion-chip" data-msg="how are you">😊 How are you</button>
                    <button type="button" class="suggestion-chip" data-msg="what is your name">🤖 What is your name</button>
                    <button type="button" class="suggestion-chip" data-msg="thanks">✨ Thanks</button>
                    <button type="button" class="suggestion-chip" data-msg="bye">👋 Bye</button>
                </div>
            </div>

            <!-- Chat Messages Log -->
            <section class="chat-messages-container" id="chat-messages" aria-label="Chat message history" role="log" aria-live="polite">
                <!-- Initial Bot Welcome Message -->
                <div class="message-wrapper bot-message animate-in">
                    <div class="message-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                        </svg>
                    </div>
                    <div class="message-content">
                        <div class="bubble bot-bubble">
                            Hello! 👋 I'm PyBot, your rule-based assistant. Send me a greeting like <strong>"hi"</strong>, ask <strong>"how are you"</strong>, or pick a suggestion above to start chatting!
                        </div>
                        <span class="message-timestamp">Just now</span>
                    </div>
                </div>

                <!-- Typing indicator (hidden by default) -->
                <div class="message-wrapper bot-message typing-indicator-wrapper" id="typing-indicator" style="display: none;">
                    <div class="message-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                        </svg>
                    </div>
                    <div class="bubble bot-bubble typing-bubble">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </section>

            <!-- Chat Input Area -->
            <footer class="chat-input-area">
                <form id="chat-form" class="chat-form" autocomplete="off">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="user-input" 
                            name="user-input" 
                            class="chat-text-input" 
                            placeholder="Type a message (e.g. 'hello', 'how are you')..." 
                            autocomplete="off"
                            maxlength="250"
                            required
                        >
                    </div>
                    <button type="submit" id="send-btn" class="send-button" aria-label="Send message">
                        <span>Send</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
                <div class="input-hint">
                    Press <kbd>Enter ↵</kbd> to send • Rule-based Python Flask Engine
                </div>
            </footer>

        </main>
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
